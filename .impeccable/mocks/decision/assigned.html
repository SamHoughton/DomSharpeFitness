<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Public Information, first viewport</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0a58b8;--red:#d7141f;--yellow:#ffc400;--ink:#111;--paper:#f4f4f1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.nav{position:absolute;inset:0 0 auto 0;height:84px;display:flex;align-items:center;gap:36px;padding:0 56px;font-weight:600;font-size:22px;z-index:5}
.nav b{font-weight:800;font-size:26px;margin-right:auto;letter-spacing:-.01em}
.btn{background:var(--yellow);color:var(--ink);font-weight:800;font-size:24px;padding:18px 30px;border:4px solid var(--ink);border-radius:14px;display:inline-block}
.nav .btn{font-size:20px;padding:12px 22px}
/* the roundel: a prohibition sign, scale pictogram inside */
.roundel{position:absolute;right:-110px;top:70px;width:820px;height:820px;border-radius:50%;border:96px solid var(--red);background:#fff;overflow:hidden}
.roundel::after{content:"";position:absolute;left:-30px;right:-30px;top:50%;height:96px;margin-top:-48px;background:var(--red);transform:rotate(-45deg)}
.scale{position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;background:var(--ink);border-radius:36px}
.scale i{position:absolute;left:50%;top:44px;width:150px;height:78px;margin-left:-75px;background:#fff;border-radius:75px 75px 0 0}
.scale u{position:absolute;left:50%;top:96px;width:6px;height:60px;margin-left:-3px;background:var(--red);transform:rotate(18deg);transform-origin:bottom}
h1{position:absolute;left:56px;top:104px;width:900px;font-size:160px;line-height:.9;font-weight:800;font-stretch:92%;letter-spacing:-.045em}
.panel{position:absolute;left:56px;bottom:150px;width:640px;background:var(--blue);color:#fff;border-radius:22px;border:5px solid #fff;outline:5px solid var(--blue);padding:30px 34px;font-size:27px;line-height:1.3;font-weight:600}
.panel p+p{margin-top:12px;font-weight:500;opacity:.92}
.cta{position:absolute;left:56px;bottom:56px}
.dir{position:absolute;right:56px;bottom:56px;width:420px;background:var(--blue);color:#fff;border-radius:18px;border:5px solid #fff;outline:5px solid var(--blue);padding:8px 26px;font-weight:700;font-size:24px}
.dir div{display:flex;justify-content:space-between;padding:16px 0;border-bottom:3px solid rgba(255,255,255,.35)}
.dir div:last-child{border:0}
</style></head><body>
<div class="nav"><b>Sharpe Strength</b><span>Results</span><span>First session</span><span>Where</span><span>Prices</span><span>HYROX</span><span class="btn">Free consultation</span></div>
<div class="roundel"><div class="scale"><i></i><u></u></div></div>
<h1>The scale isn’t what matters.</h1>
<div class="panel"><p>1:1 coaching in Hitchin and Letchworth.</p><p>Every client scanned on an InBody, not weighed on a bathroom scale.</p></div>
<div class="cta"><span class="btn">Book the free consultation →</span></div>
<div class="dir"><div><span>Nervous of gyms</span><span>→</span></div><div><span>Racing or lifting</span><span>→</span></div></div>
</body></html>
