<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Programme Card, first viewport</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:#b9d9c8;color:#16213b;font-family:"Special Elite","Courier New",monospace}
.card{position:absolute;inset:36px 48px;background:#d6ecde;border:3px solid #16213b;padding:30px 44px}
.top{display:flex;justify-content:space-between;font-size:22px;letter-spacing:.14em;text-transform:uppercase;border-bottom:3px solid #16213b;padding-bottom:12px}
h1{font-weight:400;font-size:112px;line-height:.98;margin:26px 0 18px;text-transform:uppercase;letter-spacing:-.02em}
.name{font-family:"Reenie Beanie",cursive;font-size:44px;color:#1c3fa8}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:20px}
th{font-weight:400;text-align:left;border:2px solid #16213b;padding:8px 12px;text-transform:uppercase;letter-spacing:.1em;background:#c3e1d0}
td{border:2px solid #16213b;padding:2px 12px;height:50px;font-family:"Reenie Beanie",cursive;font-size:38px;color:#1c3fa8}
td.x{color:#c11a1a;text-decoration:line-through;text-decoration-thickness:4px}
.stamp{position:absolute;right:92px;top:210px;border:6px solid #c11a1a;color:#c11a1a;padding:8px 20px;font-size:42px;transform:rotate(-8deg);text-transform:uppercase}
.btn{position:absolute;right:92px;bottom:70px;background:#16213b;color:#d6ecde;padding:20px 30px;font-size:26px;text-transform:uppercase;letter-spacing:.06em}
</style></head><body>
<div class="card">
<div class="top"><span>Sharpe Strength · programme card</span><span>Hitchin · Letchworth</span></div>
<h1>The scale<br>isn’t what<br>matters.</h1>
<div class="name">Name: you. Start date: whenever you’re ready.</div>
<div class="stamp">Scan, not scale</div>
<table><tr><th>Week</th><th>Scale (kg)</th><th>Body fat %</th><th>Muscle (kg)</th><th>Note</th></tr>
<tr><td>1</td><td class="x">79.8</td><td>23.1</td><td>34.7</td><td>first scan</td></tr>
<tr><td>4</td><td class="x">79.1</td><td>21.0</td><td>35.4</td><td>sleeping better</td></tr>
<tr><td>8</td><td class="x">78.6</td><td>18.9</td><td>36.2</td><td>scale barely moved</td></tr></table>
</div>
<div class="btn">Book the free consultation</div>
</body></html>
