<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Sharpe Strength</title>
  <link rel="icon" href="/img/favicon.ico">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #0f0f0f; --bg-alt: #161616; --bg-card: #1a1a1a;
      --border: rgba(255,255,255,0.10); --accent: #C8923A; --accent-dark: #a87530;
      --text: #fff; --text-muted: rgba(255,255,255,0.55);
      --font-h: 'Oswald', sans-serif; --font-b: 'Montserrat', sans-serif;
      --radius: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-b); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: var(--font-b); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 30%, rgba(200,146,58,0.08) 0%, transparent 70%);
    }
    .login-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 48px 40px; width: 100%; max-width: 400px; text-align: center;
    }
    .login-logo { font-family: var(--font-h); font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .login-logo span { color: var(--accent); }
    .login-sub { color: var(--text-muted); margin-bottom: 32px; font-size: 13px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .field input { width: 100%; background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-family: var(--font-b); font-size: 14px; outline: none; transition: border-color .2s; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: rgba(255,255,255,0.35); }
    .btn-primary { width: 100%; background: var(--accent); color: #111; border: none; border-radius: var(--radius); padding: 12px; font-family: var(--font-h); font-size: 1rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; transition: background .2s; margin-top: 8px; }
    .btn-primary:hover { background: var(--accent-dark); color: #fff; }
    #login-error { color: #ff8080; font-size: 13px; margin-top: 12px; display: none; }

    /* ── APP SHELL ── */
    #app { display: none; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      padding: 16px 32px; background: var(--bg-alt); border-bottom: 1px solid var(--border);
    }
    .brand { font-family: var(--font-h); font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
    .brand span { color: var(--accent); }
    .brand-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
    .topbar-spacer { flex: 1; }
    .topbar-user { font-size: 13px; color: var(--text-muted); text-align: right; }
    .topbar-user strong { display: block; color: var(--text); }
    .btn-logout { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius); padding: 8px 14px; font-size: 12px; transition: all .2s; }
    .btn-logout:hover { border-color: var(--accent); color: var(--accent); }
    .site-link { font-size: 12px; color: var(--text-muted); transition: color .2s; }
    .site-link:hover { color: var(--accent); }

    .main { padding: 32px; max-width: 1400px; margin: 0 auto; }
    .page-header { margin-bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .page-title { font-family: var(--font-h); font-size: 1.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .page-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-value { font-family: var(--font-h); font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }
    .cell-msg { max-width: 320px; color: var(--text-muted); font-size: 12px; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .badge-new { background: rgba(200,146,58,0.18); color: var(--accent); }
    .badge-contacted { background: rgba(100,160,240,0.18); color: #7ab0ff; }
    .badge-converted { background: rgba(80,200,120,0.18); color: #5fd98c; }

    .btn { border: none; border-radius: var(--radius); padding: 7px 14px; font-size: 12px; font-weight: 600; transition: all .2s; }
    .btn-accent { background: var(--accent); color: #111; }
    .btn-accent:hover { background: var(--accent-dark); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: rgba(224,92,92,0.15); border: 1px solid rgba(224,92,92,0.35); color: #ff8080; }
    .btn-danger:hover { background: rgba(224,92,92,0.28); }
    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    #toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 20px; font-size: 13px; z-index: 999; transform: translateY(80px); opacity: 0; transition: all .3s; }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: #5fd98c; color: #5fd98c; }
    #toast.error { border-color: #ff8080; color: #ff8080; }

    .empty { text-align: center; color: var(--text-muted); padding: 48px 0; font-size: 13px; }
    .select-sm { background: var(--bg-alt); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 6px 10px; font-size: 12px; font-family: var(--font-b); }
    .select-sm option { background: var(--bg-card); }

    @media (max-width: 700px) {
      .topbar { padding: 14px 18px; }
      .main { padding: 20px 18px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Sharpe <span>Strength</span></div>
    <div class="login-sub">Admin</div>
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="dom@sharpestrength.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn">Sign In</button>
    <div id="login-error" role="alert">Incorrect email or password.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">Sharpe <span>Strength</span></div>
      <div class="brand-sub">Admin</div>
    </div>
    <div class="topbar-spacer"></div>
    <a class="site-link" href="/"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</a>
    <div class="topbar-user">Signed in as<strong id="admin-name">-</strong></div>
    <button class="btn-logout" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
  </header>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Consultations</div>
        <div class="page-subtitle">Enquiries from the website consultation form</div>
      </div>
      <div class="btn-row">
        <select class="select-sm" id="consultation-filter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="converted">Converted</option>
        </select>
        <button class="btn btn-ghost" id="refresh-btn"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-value" id="stat-new">-</div><div class="stat-label">New</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-contacted">-</div><div class="stat-label">Contacted</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-converted">-</div><div class="stat-label">Converted</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-total">-</div><div class="stat-label">Total Enquiries</div></div>
    </div>

    <div class="panel">
      <div class="table-wrap" id="consultations-table"><div class="empty">Loading…</div></div>
    </div>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  // Set window.RAILWAY_API_URL in a <script> before this file to override.
  const API = (window.RAILWAY_API_URL || 'https://domsharpefitness-production.up.railway.app').replace(/\/$/, '');

  // ── STATE ───────────────────────────────────────────────
  let token = localStorage.getItem('admin_token');
  let currentUser = null;
  let allConsultations = [];

  // ── HELPERS ─────────────────────────────────────────────
  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    return res.json();
  }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3500);
  }

  function fmt(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // Escape untrusted values before they go anywhere near innerHTML.
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  // ── AUTH ────────────────────────────────────────────────
  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');

    btn.textContent = 'Signing in…';
    btn.disabled = true;
    err.style.display = 'none';

    try {
      const data = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      }).then(r => r.json());

      if (!data.token) throw new Error(data.error || 'Login failed');
      if (!data.user.is_dom) throw new Error('Admin access only');

      token = data.token;
      currentUser = data.user;
      localStorage.setItem('admin_token', token);
      showApp();
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
    } finally {
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  }

  function logout() {
    token = null;
    currentUser = null;
    localStorage.removeItem('admin_token');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  // ── BOOTSTRAP ────────────────────────────────────────────
  async function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    if (!currentUser) {
      try { currentUser = await api('/api/auth/me'); }
      catch { return logout(); }
    }

    document.getElementById('admin-name').textContent = currentUser.name;
    loadConsultations();
  }

  // ── CONSULTATIONS ─────────────────────────────────────────
  async function loadConsultations() {
    const target = document.getElementById('consultations-table');
    target.innerHTML = '<div class="empty">Loading…</div>';
    try {
      allConsultations = await api('/api/consultations');
      renderStats();
      renderTable();
    } catch (e) {
      target.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  }

  function renderStats() {
    const count = s => allConsultations.filter(c => c.status === s).length;
    document.getElementById('stat-new').textContent       = count('new');
    document.getElementById('stat-contacted').textContent = count('contacted');
    document.getElementById('stat-converted').textContent = count('converted');
    document.getElementById('stat-total').textContent     = allConsultations.length;
  }

  function renderTable() {
    const filter = document.getElementById('consultation-filter').value;
    const rows = filter ? allConsultations.filter(c => c.status === filter) : allConsultations;
    const target = document.getElementById('consultations-table');

    if (!rows.length) {
      target.innerHTML = '<div class="empty">No consultations found</div>';
      return;
    }

    target.innerHTML = `<table>
      <thead><tr>
        <th>Name</th><th>Contact</th><th>Goal</th><th>Experience</th>
        <th>Availability</th><th>Message</th><th>Date</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>${rows.map(c => `<tr>
        <td><strong>${esc(c.name)}</strong></td>
        <td><a href="mailto:${esc(c.email)}" style="color:var(--accent)">${esc(c.email)}</a></td>
        <td>${esc(c.goal) || '-'}</td>
        <td>${esc(c.experience) || '-'}</td>
        <td>${esc(c.availability) || '-'}</td>
        <td class="cell-msg">${esc(c.message) || '-'}</td>
        <td style="white-space:nowrap">${fmt(c.created_at)}</td>
        <td><span class="badge badge-${esc(c.status)}">${esc(c.status)}</span></td>
        <td>
          <div class="btn-row">
            <select class="select-sm" data-id="${esc(c.id)}" data-action="status" aria-label="Change status">
              <option value="new"       ${c.status === 'new'       ? 'selected' : ''}>New</option>
              <option value="contacted" ${c.status === 'contacted' ? 'selected' : ''}>Contacted</option>
              <option value="converted" ${c.status === 'converted' ? 'selected' : ''}>Converted</option>
            </select>
            <button class="btn btn-sm btn-danger" data-id="${esc(c.id)}" data-action="delete">Delete</button>
          </div>
        </td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  async function updateConsultationStatus(id, status) {
    try {
      await api(`/api/consultations/${id}`, { method: 'PUT', body: { status } });
      const row = allConsultations.find(c => c.id === id);
      if (row) row.status = status;
      toast('Status updated');
      renderStats();
      renderTable();
    } catch (e) { toast(e.message, 'error'); }
  }

  async function deleteConsultation(id) {
    if (!confirm('Delete this consultation? This cannot be undone.')) return;
    try {
      await api(`/api/consultations/${id}`, { method: 'DELETE' });
      allConsultations = allConsultations.filter(c => c.id !== id);
      toast('Consultation deleted');
      renderStats();
      renderTable();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── EVENTS ────────────────────────────────────────────────
  // Delegated so re-rendering the table never orphans a listener.
  document.getElementById('consultations-table').addEventListener('change', e => {
    const el = e.target.closest('[data-action="status"]');
    if (el) updateConsultationStatus(el.dataset.id, el.value);
  });

  document.getElementById('consultations-table').addEventListener('click', e => {
    const el = e.target.closest('[data-action="delete"]');
    if (el) deleteConsultation(el.dataset.id);
  });

  document.getElementById('consultation-filter').addEventListener('change', renderTable);
  document.getElementById('refresh-btn').addEventListener('click', loadConsultations);
  document.getElementById('login-btn').addEventListener('click', login);
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  // ── INIT ──────────────────────────────────────────────────
  if (token) showApp(); else document.getElementById('login-screen').style.display = 'flex';
</script>

</body>
</html>
