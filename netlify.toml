[build]
  publish = "."

# The site is plain HTML/CSS/JS, nothing to compile.
[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Sources allowed: Google Fonts, Font Awesome (Cloudflare), the Google Maps
    # embed, Google Analytics (only fires once a Measurement ID is set), and the
    # Railway API the consultation form posts to.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://*.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.google.co.uk https://maps.gstatic.com https://*.googleapis.com;
      frame-src https://maps.google.com https://www.google.com;
      connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net;
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      frame-ancestors 'self'
    """

# Long-cache fingerprint-free assets conservatively; HTML stays fresh.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The old Netlify subdomain must not compete with the real domain in search.
[[redirects]]
  from = "https://domsharpefitness.netlify.app/*"
  to = "https://sharpestrength.com/:splat"
  status = 301
  force = true

# Clean URLs. The .html versions 301 to the clean path, which then rewrites
# to the file. Canonicals, the sitemap and every internal link use the clean
# paths. force = true is required on the 301s: Netlify serves an existing
# static file at its literal path before it ever evaluates a redirect rule,
# so without force these .html paths were quietly returning 200 instead of
# redirecting, leaving a live duplicate-content URL for each page.
[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/personal-trainer-hitchin.html"
  to = "/personal-trainer-hitchin"
  status = 301
  force = true

[[redirects]]
  from = "/personal-trainer-hitchin"
  to = "/personal-trainer-hitchin.html"
  status = 200

[[redirects]]
  from = "/personal-trainer-letchworth.html"
  to = "/personal-trainer-letchworth"
  status = 301
  force = true

[[redirects]]
  from = "/personal-trainer-letchworth"
  to = "/personal-trainer-letchworth.html"
  status = 200

[[redirects]]
  from = "/gyms-in-hitchin.html"
  to = "/gyms-in-hitchin"
  status = 301
  force = true

[[redirects]]
  from = "/gyms-in-hitchin"
  to = "/gyms-in-hitchin.html"
  status = 200
